      color: #333;

      font-size: 15px;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      color: #333333;
      padding: 10px 14px;

      cursor: pointer;

    }

      height: 18px;
      accent-color: #1a73e8;
      cursor: pointer;
    }

    .option-item.correct-opt {
      background-color: #d4edda !important;
      color: #155724;
      font-weight: bold;
    }
    .option-item.wrong-opt {

      color: #721c24;

    let currentLanguage = 'te';

    function setLanguage(lang) {
      currentLanguage = lang;
      document.getElementById('btn-en').className = lang === 'en' ? 'toggle-btn active' : 'toggle-btn inactive';
      document.getElementById('btn-te').className = lang === 'te' ? 'toggle-btn active' : 'toggle-btn inactive';
      document.getElementById('sub-btn').innerText = lang === 'en' ? 'Submit Answers' : 'సమర్పించు (Submit)';
      renderQuestions();
    }

    function renderQuestions() {
      const quizContainer = document.getElementById('quiz-list');
      quizContainer.innerHTML = '';

      questionsData.forEach((item) => {
        const data = item[currentLanguage];

        // Render Passage Box before Question 12
        if (item.isPassageGroup) {
          const passageDiv = document.createElement('div');
          passageDiv.className = 'passage-box';
          passageDiv.innerHTML = `
            <div class="passage-title">${data.passageTitle}</div>
            <div>${data.passageText}</div>
          `;
          quizContainer.appendChild(passageDiv);
        }

        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${item.id}`;

        let subTextHTML = data.subText ? `<div class="sub-text">${data.subText}</div>` : '';

        let optionsHTML = data.opts.map((opt, idx) => `
          <label class="option-item" id="opt-label-${item.id}-${idx}">
            <input type="radio" name="q_${item.id}" value="${idx}">
            <span>${opt}</span>
          </label>
        `).join('');

        card.innerHTML = `
          <div class="question-title">${data.q}</div>
          ${subTextHTML}
          <div class="options-list">${optionsHTML}</div>
        `;

        quizContainer.appendChild(card);
      });
    }

    function calculateScore() {
      let score = 0;
      const total = questionsData.length;

      questionsData.forEach((item) => {
        const selectedOption = document.querySelector(`input[name="q_${item.id}"]:checked`);
        const correctIdx = item.correctAns;

        // Reset previous styling
        for (let i = 0; i < item[currentLanguage].opts.length; i++) {
          const label = document.getElementById(`opt-label-${item.id}-${i}`);
          label.classList.remove('correct-opt', 'wrong-opt');
        }

        // Highlight correct option in green
        document.getElementById(`opt-label-${item.id}-${correctIdx}`).classList.add('correct-opt');

        if (selectedOption) {
          const userAns = parseInt(selectedOption.value);
          if (userAns === correctIdx) {
            score++;
          } else {
            // Highlight user's wrong option in red
            document.getElementById(`opt-label-${item.id}-${userAns}`).classList.add('wrong-opt');
          }
        }
      });

      // Show Score
      const scoreBoard = document.getElementById('score-board');
      scoreBoard.style.display = 'block';
      scoreBoard.innerHTML = currentLanguage === 'en' 
        ? `🎯 Your Score: ${score} / ${total}` 
        : `🎯 మీ స్కోరు: ${score} / ${total}`;
      
      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Default load Telugu language
    setLanguage('te');
  </script>
</body>
</html>
